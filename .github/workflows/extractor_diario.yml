name: Extracción Diaria de Jurisprudencia TSJ

on:
  schedule:
    # 23:00 UTC = 7:00 PM (19:00) hora de Venezuela (UTC-4) todos los días
    - cron: '0 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extraer-jurisprudencia:
    runs-on: self-hosted
    timeout-minutes: 180

    steps:
      - name: 1. Descargar repositorio
        uses: actions/checkout@v4

      - name: 2. Ejecutar extractor web TSJ en PC local
        shell: cmd
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_API_KEY_2: ${{ secrets.OPENROUTER_API_KEY_2 }}
          PYTHONIOENCODING: utf-8
        run: |
          if exist "C:\Users\Usuario\AppData\Local\Python\pythoncore-3.15-64\python.exe" (
            set "PY=C:\Users\Usuario\AppData\Local\Python\pythoncore-3.15-64\python.exe"
          ) else if exist "C:\Users\Usuario\AppData\Local\Programs\Python\Python311\python.exe" (
            set "PY=C:\Users\Usuario\AppData\Local\Programs\Python\Python311\python.exe"
          ) else (
            set "PY=python"
          )
          "%PY%" -u extractor_web.py

      - name: 3. Guardar cambios en GitHub
        if: always()
        shell: cmd
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add jurisprudencia_ia.db
          if exist reporte_jurisprudencia.csv git add reporte_jurisprudencia.csv
          git diff --staged --quiet || (git commit -m "🤖 Actualización automática jurisprudencia TSJ [skip ci]" && git pull --rebase origin main && git push)
