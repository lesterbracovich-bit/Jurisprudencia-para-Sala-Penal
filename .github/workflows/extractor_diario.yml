name: Extracción Diaria de Jurisprudencia TSJ

on:
  schedule:
    # 23:00 UTC = 7:00 PM (19:00) hora de Venezuela (UTC-4) todos los días
    - cron: '0 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extraer-jurisprudencia:
    runs-on: self-hosted
    timeout-minutes: 60

    steps:
      - name: 1. Descargar repositorio
        uses: actions/checkout@v4

      - name: 2. Ejecutar extractor web TSJ en PC local
        shell: cmd
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          python -u extractor_web.py

      - name: 3. Guardar cambios en GitHub
        shell: cmd
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add jurisprudencia_ia.db
          if exist reporte_jurisprudencia.csv git add reporte_jurisprudencia.csv
          git diff --staged --quiet || (git commit -m "🤖 Actualización automática jurisprudencia TSJ [skip ci]" && git push)
