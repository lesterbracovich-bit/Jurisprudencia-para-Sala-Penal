name: Extracción Diaria de Jurisprudencia TSJ

on:
  schedule:
    # 23:00 UTC = 7:00 PM (19:00) hora de Venezuela (UTC-4) todos los días
    - cron: '0 23 * * *'
  workflow_dispatch: # Permite probarlo manualmente cuando quieras

permissions:
  contents: write

jobs:
  extraer-jurisprudencia:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar Extractor Web TSJ
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -u extractor_web.py

      - name: Confirmar y subir cambios a GitHub
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add jurisprudencia_ia.db reporte_jurisprudencia.csv
          if git diff --staged --quiet; then
            echo "✨ No hubo sentencias nuevas hoy. Base de datos al día."
          else
            git commit -m "🤖 Actualización automática jurisprudencia TSJ [skip ci]"
            git push
          fi
