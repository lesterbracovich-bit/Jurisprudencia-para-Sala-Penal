name: Actualizar Jurisprudencia TSJ

on:
  schedule:
    - cron: '0 3 * * 2,6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extraer-jurisprudencia:
    runs-on: self-hosted
    timeout-minutes: 45
    steps:
      - name: 1. Descargar repositorio
        uses: actions/checkout@v4

      - name: 2. Ejecutar extractor del TSJ en PC local
        shell: cmd
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONIOENCODING: utf-8
          PLAYWRIGHT_BROWSERS_PATH: C:\Users\Usuario\AppData\Local\ms-playwright
        run: |
          for /f "delims=" %%i in ('where python') do set "PYTHON_PATH=%%i"
          if "%PYTHON_PATH%"=="" set "PYTHON_PATH=C:\Users\Usuario\AppData\Local\Programs\Python\Python311\python.exe"
          "%PYTHON_PATH%" -u extractor_web.py

      - name: 3. Guardar cambios en GitHub
        shell: cmd
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add jurisprudencia_ia.db
          if exist reporte_jurisprudencia.csv git add reporte_jurisprudencia.csv
          git diff --staged --quiet || (git commit -m "Actualizacion automatica TSJ" && git push)
