name: Actualizar Jurisprudencia TSJ

on:
  schedule:
    # Lunes y Viernes a las 23:00 hora de Venezuela (03:00 UTC del Martes [2] y Sábado [6])
    - cron: '0 3 * * 2,6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extraer-jurisprudencia:
    runs-on: self-hosted
    timeout-minutes: 45
    steps:
      - name: 1. Descargar repositorio
        uses: actions/checkout@v4

      - name: 2. Ejecutar extractor del TSJ en PC local
        shell: powershell
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONIOENCODING: utf-8
        run: python -u extractor_web.py

      - name: 3. Guardar cambios en GitHub
        shell: powershell
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add jurisprudencia_ia.db
          if (Test-Path "reporte_jurisprudencia.csv") {
            git add reporte_jurisprudencia.csv
          }
          $cambios = git status --porcelain
          if ($cambios) {
            $fecha = Get-Date -Format "dd/MM/yyyy HH:mm"
            git commit -m "chore(db): actualizacion automatica TSJ ($fecha)"
            git push
          } else {
            Write-Host "Sin cambios nuevos en la base de datos."
          }
