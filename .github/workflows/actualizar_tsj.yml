name: Actualizar Jurisprudencia TSJ

on:
  schedule:
    - cron: '0 3 * * 2,6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extraer-jurisprudencia:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: 1. Descargar repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Instalar dependencias
        run: pip install --upgrade pip google-genai beautifulsoup4 requests urllib3 playwright && playwright install --with-deps chromium

      - name: 4. Ejecutar extractor del TSJ
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TSJ_PROXY_URL: ${{ secrets.TSJ_PROXY_URL }}
        run: python extractor_web.py

      - name: 5. Guardar cambios en GitHub
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add jurisprudencia_ia.db
          if [ -f reporte_jurisprudencia.csv ]; then git add reporte_jurisprudencia.csv; fi
          git diff --staged --quiet || (git commit -m "Actualizacion automatica TSJ" && git push)
